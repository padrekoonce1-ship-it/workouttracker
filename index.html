<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>2026 Sprint 1 - Week 2</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Global font size increase (approx +2pt) */
        html { font-size: 18px; } 
        body {
            background-color: #000000; color: #ffffff;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .card { background: #111; border: 1px solid #222; }
        .slider {
            -webkit-appearance: none; width: 100%; height: 8px;
            border-radius: 5px; background: #333; outline: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 30px; height: 30px;
            border-radius: 50%; background: #3b82f6; cursor: pointer;
        }
        .btn-choice {
            padding: 12px; border-radius: 12px; background: #1a1a1a;
            border: 1px solid #333; font-weight: bold; font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .btn-choice.selected { background: #3b82f6; border-color: #3b82f6; color: white; }
        .btn-choice.selected-no { background: #22c55e; border-color: #22c55e; color: white; }
        .btn-choice.selected-yes { background: #ef4444; border-color: #ef4444; color: white; }
        
        .tab-active { color: #3b82f6; border-bottom: 3px solid #3b82f6; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 pb-40 md:max-w-lg md:mx-auto">

    <!-- Header & Tabs -->
    <header class="mb-4">
        <h1 id="routine-title" class="text-2xl font-black text-blue-500 italic uppercase">Sprint 1 / Week 2</h1>
        <p id="current-date" class="text-zinc-500 font-mono text-xs uppercase"></p>
    </header>

    <nav class="flex border-b border-zinc-800 mb-6 sticky top-0 bg-black z-10">
        <button onclick="switchTab('active')" id="tab-active" class="flex-1 py-3 text-sm font-bold uppercase tracking-wider tab-active">Session</button>
        <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-3 text-sm font-bold uppercase tracking-wider text-zinc-500">History</button>
    </nav>

    <!-- ACTIVE SESSION VIEW -->
    <main id="view-active" class="block space-y-8">
        
        <!-- PHASE 1: PRE-WORKOUT -->
        <section class="space-y-4">
            <h2 class="text-blue-400 font-black text-xs uppercase tracking-widest pl-1">I. Pre-Workout Report</h2>
            <div class="card rounded-2xl p-5 space-y-6">
                <div>
                    <label class="block text-xs font-bold mb-3 uppercase text-zinc-500">MG Fatigue (1-5)</label>
                    <input type="range" min="1" max="5" value="1" class="slider" id="mg-fatigue" oninput="saveCurrent()">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-3 uppercase text-zinc-500">General Readiness (1-5)</label>
                    <input type="range" min="1" max="5" value="5" class="slider" id="readiness" oninput="saveCurrent()">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-[10px] font-bold uppercase text-zinc-500">Hydration</label>
                        <select id="pre-hydration" class="w-full bg-zinc-900 border border-zinc-700 p-3 rounded-xl text-sm" onchange="saveCurrent()">
                            <option value="On Target">On Target</option>
                            <option value="Below Target">Below Target</option>
                            <option value="Above Target">Above Target</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[10px] font-bold uppercase text-zinc-500">Protein</label>
                        <select id="pre-protein" class="w-full bg-zinc-900 border border-zinc-700 p-3 rounded-xl text-sm" onchange="saveCurrent()">
                            <option value="On Target">On Target</option>
                            <option value="Below Target">Below Target</option>
                            <option value="Above Target">Above Target</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>

        <!-- PHASE 2: THE WORKOUT -->
        <section class="space-y-4">
            <h2 class="text-blue-400 font-black text-xs uppercase tracking-widest pl-1">II. The Workout</h2>
            <div id="workout-content" class="space-y-8">
                <!-- Injected via JS -->
            </div>
        </section>

        <!-- PHASE 3: POST-WORKOUT -->
        <section class="space-y-4">
            <h2 class="text-blue-400 font-black text-xs uppercase tracking-widest pl-1">III. Post-Workout Report</h2>
            <div class="card rounded-2xl p-5 space-y-6">
                <div>
                    <label class="block text-xs font-bold mb-3 uppercase text-zinc-500 text-center">Right Knee Pain?</label>
                    <div class="flex space-x-2">
                        <button onclick="setKneePain(false)" id="knee-no" class="btn-choice flex-1 selected-no">NO</button>
                        <button onclick="setKneePain(true)" id="knee-yes" class="btn-choice flex-1">YES</button>
                    </div>
                    <div id="knee-notes-container" class="hidden mt-4">
                        <textarea id="knee-notes" placeholder="Describe pain/clicking..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm focus:outline-none focus:border-red-600" rows="2" oninput="saveCurrent()"></textarea>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-2 uppercase text-zinc-500">Session Comments</label>
                    <textarea id="session-comments" placeholder="Optional notes about training quality..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm focus:outline-none" rows="3" oninput="saveCurrent()"></textarea>
                </div>
            </div>
        </section>

        <button onclick="completeSession()" class="w-full py-5 bg-blue-600 text-white font-black rounded-2xl shadow-xl shadow-blue-900/20 uppercase tracking-widest text-lg">
            Complete Session
        </button>
    </main>

    <!-- HISTORY VIEW -->
    <main id="view-history" class="hidden space-y-6">
        <div class="flex justify-between items-center">
            <h2 class="text-xl font-bold italic">LOCAL LOGS</h2>
            <button onclick="clearHistory()" class="text-xs text-red-500 font-bold uppercase">Clear History</button>
        </div>
        <div id="history-container" class="space-y-4"></div>
        <button onclick="copyHistory()" class="w-full py-4 bg-zinc-100 text-black font-black rounded-2xl uppercase text-sm">
            Copy XML Log for Sheets
        </button>
    </main>

    <!-- Auto-save notification -->
    <div class="fixed bottom-0 left-0 right-0 p-4 bg-black/90 backdrop-blur-lg border-t border-zinc-900 md:max-w-lg md:mx-auto text-center">
        <span id="save-indicator" class="text-[10px] font-mono text-zinc-600 italic uppercase">Auto-saved to local memory</span>
    </div>

    <script>
        // Routine Definitions for Week 2
        const routines = {
            A: { // Sun, Tue, Thu
                id: "A", title: "Strength & Alignment",
                structure: "circuit",
                rounds: 3,
                exercises: [{name:"Scapular Pull-ups", target:"10r"}, {name:"Hollow Body Holds", target:"30-45s"}, {name:"Banded Leg Align", target:"15r"}]
            },
            B: { // Mon, Wed
                id: "B", title: "Mobility & Skills",
                structure: "special",
                groups: [
                    { name: "Initial Work", exercises: [{name:"Ankle Wall Drives", target:"15 reps"}], rounds: 3 },
                    { name: "Skill Supersets", exercises: [{name:"Planche Leans", target:"30s"}, {name:"90/90 Hip Openers", target:"30s"}], rounds: 5 }
                ]
            },
            C: { // Fri, Sat
                id: "C", title: "Active Recovery & Rest",
                structure: "rest",
                rounds: 0, exercises: []
            }
        };

        let currentMode = 'A';
        let hasKneePain = false;

        function init() {
            const day = new Date().getDay();
            // Determine Routine
            if ([0, 2, 4].includes(day)) currentMode = 'A';
            else if ([1, 3].includes(day)) currentMode = 'B';
            else currentMode = 'C';

            document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            document.getElementById('routine-title').innerText = routines[currentMode].title;
            
            renderWorkout();
            loadCurrent();
            updateHistoryView();
        }

        function renderWorkout() {
            const container = document.getElementById('workout-content');
            const data = routines[currentMode];
            let html = "";

            if (data.structure === 'rest') {
                html = `<div class="card p-5 rounded-2xl text-center italic text-zinc-500">Planned rest or active recovery day. Add comments in the post-workout section.</div>`;
            } else if (data.structure === 'circuit') {
                for (let r = 1; r <= data.rounds; r++) {
                    html += `<div class="space-y-4">
                        <div class="flex items-center space-x-2"><h2 class="text-[10px] font-black text-zinc-700 uppercase">Circuit Round ${r}</h2><span class="h-px flex-1 bg-zinc-900"></span></div>
                        ${data.exercises.map(ex => renderExCard(ex, r)).join('')}
                    </div>`;
                }
            } else if (data.structure === 'special') {
                data.groups.forEach(group => {
                    html += `<div class="space-y-4">
                        <div class="flex items-center space-x-2"><h2 class="text-[10px] font-black text-blue-900 uppercase">${group.name}</h2><span class="h-px flex-1 bg-zinc-900"></span></div>
                        ${Array.from({length: group.rounds}).map((_, r) => 
                            group.exercises.map(ex => renderExCard(ex, r+1, group.name)).join('')
                        ).join('')}
                    </div>`;
                });
            }
            container.innerHTML = html;
        }

        function renderExCard(ex, round, groupName = '') {
            const id = `${groupName}-${round}-${ex.name}`;
            return `<div class="card rounded-2xl p-4">
                <div class="flex items-center justify-between mb-2">
                    <div>
                        <h3 class="text-md font-bold text-zinc-200">${ex.name}</h3>
                        <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest">${ex.target}</p>
                    </div>
                    <input type="checkbox" class="round-check w-8 h-8 rounded-xl bg-zinc-900 border-zinc-700 accent-blue-600" data-id="${id}" onchange="saveCurrent()">
                </div>
                <input type="text" placeholder="Set notes..." class="round-note w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-400 focus:outline-none" data-id="n-${id}" oninput="saveCurrent()">
            </div>`;
        }

        function setKneePain(val) {
            hasKneePain = val;
            document.getElementById('knee-yes').className = val ? 'btn-choice flex-1 selected-yes' : 'btn-choice flex-1';
            document.getElementById('knee-no').className = !val ? 'btn-choice flex-1 selected-no' : 'btn-choice flex-1';
            document.getElementById('knee-notes-container').style.display = val ? 'block' : 'none';
            saveCurrent();
        }

        function switchTab(tab) {
            document.getElementById('view-active').style.display = tab === 'active' ? 'block' : 'none';
            document.getElementById('view-history').style.display = tab === 'history' ? 'block' : 'none';
            document.getElementById('tab-active').className = tab === 'active' ? 'flex-1 py-3 text-sm font-bold uppercase tracking-wider tab-active' : 'flex-1 py-3 text-sm font-bold uppercase tracking-wider text-zinc-500';
            document.getElementById('tab-history').className = tab === 'history' ? 'flex-1 py-3 text-sm font-bold uppercase tracking-wider tab-active' : 'flex-1 py-3 text-sm font-bold uppercase tracking-wider text-zinc-500';
            if (tab === 'history') updateHistoryView();
        }

        function saveCurrent() {
            const state = {
                mg: document.getElementById('mg-fatigue').value,
                ready: document.getElementById('readiness').value,
                hydration: document.getElementById('pre-hydration').value,
                protein: document.getElementById('pre-protein').value,
                knee: hasKneePain,
                kneeNotes: document.getElementById('knee-notes').value,
                comments: document.getElementById('session-comments').value,
                checks: {},
                notes: {}
            };
            document.querySelectorAll('.round-check').forEach(c => state.checks[c.dataset.id] = c.checked);
            document.querySelectorAll('.round-note').forEach(n => state.notes[n.dataset.id] = n.value);
            localStorage.setItem('sprint1_w2_state', JSON.stringify(state));
        }

        function loadCurrent() {
            const saved = localStorage.getItem('sprint1_w2_state');
            if (!saved) { setKneePain(false); return; }
            const state = JSON.parse(saved);
            
            document.getElementById('mg-fatigue').value = state.mg;
            document.getElementById('readiness').value = state.ready;
            document.getElementById('pre-hydration').value = state.hydration || "On Target";
            document.getElementById('pre-protein').value = state.protein || "On Target";
            setKneePain(state.knee);
            document.getElementById('knee-notes').value = state.kneeNotes || "";
            document.getElementById('session-comments').value = state.comments || "";
            
            document.querySelectorAll('.round-check').forEach(c => c.checked = state.checks[c.dataset.id] || false);
            document.querySelectorAll('.round-note').forEach(n => n.value = state.notes[n.dataset.id] || "");
        }

        function completeSession() {
            const now = new Date();
            const timestamp = now.toISOString();
            const mg = document.getElementById('mg-fatigue').value;
            const ready = document.getElementById('readiness').value;
            const hydration = document.getElementById('pre-hydration').value;
            const protein = document.getElementById('pre-protein').value;
            const knee = hasKneePain ? `YES: ${document.getElementById('knee-notes').value}` : "NO";
            const sessionComments = document.getElementById('session-comments').value;
            
            let workoutDetails = [];
            document.querySelectorAll('.round-check').forEach(c => {
                if (c.checked) {
                    const note = document.querySelector(`[data-id="n-${c.dataset.id}"]`).value;
                    workoutDetails.push(`${c.dataset.id}${note ? ' (' + note + ')' : ''}`);
                }
            });

            const logEntry = `<WORKOUT_LOG>
[TIMESTAMP]: ${timestamp}
[PRE-WORKOUT_REPORT]: Fatigue: ${mg}, Readiness: ${ready}, Hydration: ${hydration}, Protein: ${protein}
[WORKOUT_REPORT]: Routine: ${routines[currentMode].title}, Exercises: ${workoutDetails.join(' | ') || 'None'}
[POST-WORKOUT_REPORT]: Knee Pain: ${knee}, Comments: ${sessionComments || 'None'}
</WORKOUT_LOG>`;

            const history = JSON.parse(localStorage.getItem('workout_history_v2') || "[]");
            history.unshift(logEntry);
            localStorage.setItem('workout_history_v2', JSON.stringify(history));

            localStorage.removeItem('sprint1_w2_state');
            alert("Workout logged using XML format.");
            location.reload();
        }

        function updateHistoryView() {
            const history = JSON.parse(localStorage.getItem('workout_history_v2') || "[]");
            const container = document.getElementById('history-container');
            if (history.length === 0) {
                container.innerHTML = `<p class="text-zinc-600 text-sm italic text-center py-10">No history found.</p>`;
                return;
            }
            container.innerHTML = history.map(log => `
                <div class="card p-4 rounded-2xl text-[10px] font-mono whitespace-pre-wrap leading-relaxed text-zinc-400">
                    ${log.replace(/</g, '&lt;').replace(/>/g, '&gt;')}
                </div>
            `).join('');
        }

        function copyHistory() {
            const history = JSON.parse(localStorage.getItem('workout_history_v2') || "[]");
            if (history.length === 0) return;
            const textToCopy = history.join('\n\n');
            const el = document.createElement('textarea');
            el.value = textToCopy;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert("All XML logs copied to clipboard.");
        }

        function clearHistory() {
            if (confirm("Delete all Week 2 history?")) {
                localStorage.setItem('workout_history_v2', "[]");
                updateHistoryView();
            }
        }

        init();
    </script>
</body>
</html>
