<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 2 V1.2 - Mobility & Skills</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #f1f5f9; font-family: ui-sans-serif, system-ui, sans-serif; }
        .tab-active { border-bottom: 2px solid #38bdf8; color: #38bdf8; }
        .card { background-color: #0f172a; border-radius: 1rem; padding: 1.25rem; margin-bottom: 1.25rem; border: 1px solid #1e293b; transition: all 0.3s; }
        .btn-toggle { padding: 0.5rem; border-radius: 0.4rem; background: #1e293b; font-size: 0.65rem; transition: all 0.2s; cursor: pointer; text-align: center; border: 1px solid transparent; font-weight: 600; color: #94a3b8; }
        .btn-toggle.active { background: #38bdf8; color: #020617; font-weight: 900; border-color: #7dd3fc; }
        input, textarea { background: #020617; border: 1px solid #1e293b; color: white; border-radius: 0.5rem; padding: 0.6rem; width: 100%; font-size: 0.875rem; }
        label { display: block; margin-bottom: 0.35rem; font-size: 0.7rem; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.1em; }
        
        .pain-slider { -webkit-appearance: none; height: 6px; border-radius: 5px; outline: none; transition: background 0.3s; }
        .pain-0 { background: #22c55e !important; }
        .pain-1, .pain-2 { background: #eab308 !important; }
        .pain-3 { background: #ef4444 !important; }
        .pain-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #0f172a; }

        .zero-input { color: #ef4444; font-weight: 800; border-color: #450a0a; }
        .gold-check { width: 1.25rem; height: 1.25rem; accent-color: #fbbf24; cursor: pointer; }
        .ssp-matrix-grid { display: grid; grid-template-cols: 1fr 1fr; gap: 0.75rem; }
        .matrix-col { display: flex; flex-direction: column; gap: 0.25rem; }
        .block-header { border-left: 4px solid #38bdf8; padding-left: 0.75rem; margin-top: 2rem; margin-bottom: 1rem; }
    </style>
</head>
<body class="max-w-md mx-auto p-4 pb-32">

    <header class="mb-6 flex justify-between items-end">
        <div>
            <h1 class="text-[10px] font-black text-sky-500 tracking-[0.3em] uppercase">Sprint 2 • V1.2</h1>
            <h2 id="routine-title" class="text-2xl font-bold tracking-tight">Mobility & Skills</h2>
        </div>
        <div id="current-date" class="text-[10px] font-mono bg-slate-800 px-2 py-1 rounded text-slate-400"></div>
    </header>

    <nav class="flex border-b border-slate-800 mb-6 sticky top-0 bg-[#020617]/95 backdrop-blur-sm z-30">
        <button id="nav-session" class="flex-1 py-4 text-xs font-black tab-active" onclick="showTab('session')">SESSION</button>
        <button id="nav-history" class="flex-1 py-4 text-xs font-black text-slate-500" onclick="showTab('history')">ARCHIVE</button>
    </nav>

    <main id="view-session">
        
        <!-- SECTION I: PRE-WORKOUT SSP -->
        <section class="card border-t-2 border-t-sky-500">
            <h3 class="text-xs font-black mb-4 tracking-widest text-sky-400">I. PRE-WORKOUT SSP AUDIT</h3>
            <div id="pre-ssp-container" class="space-y-8"></div>
            <div class="mt-6 pt-4 border-t border-slate-800">
                <textarea id="pre-notes" rows="1" placeholder="Mindset / Readiness..."></textarea>
            </div>
        </section>

        <!-- SECTION II: WORKOUT BLOCKS -->
        <section class="card border-t-2 border-t-emerald-500">
            <h3 class="text-xs font-black mb-4 tracking-widest text-emerald-400">II. WORKOUT REPORT</h3>
            
            <div class="block-header">
                <h4 class="text-[10px] font-black text-sky-400 uppercase">Block 1: Ankle & Hips</h4>
            </div>
            <div id="block-1-list" class="space-y-10"></div>

            <div class="block-header">
                <h4 class="text-[10px] font-black text-sky-400 uppercase">Block 2: Skills & Compression</h4>
            </div>
            <div id="block-2-list" class="space-y-10"></div>
        </section>

        <!-- SECTION III: POST-WORKOUT -->
        <section class="card border-t-2 border-t-rose-500">
            <h3 class="text-xs font-black mb-4 tracking-widest text-rose-400">III. POST-WORKOUT REPORT</h3>
            <div class="mb-8 bg-slate-900/40 p-4 rounded-xl">
                <label class="text-sky-400">MG Status (The Shield)</label>
                <input type="range" id="mg-shield" min="1" max="5" value="1" class="accent-sky-500 mt-2 w-full" oninput="document.getElementById('shield-val').innerText = this.value">
                <div class="flex justify-between text-[9px] font-bold mt-1 uppercase text-slate-500">
                    <span>1: Full Power</span>
                    <span id="shield-val" class="text-sky-400">1</span>
                    <span>5: Symptomatic</span>
                </div>
            </div>
            <div id="post-ssp-container" class="space-y-8"></div>
            <div class="mt-8">
                <textarea id="post-notes" rows="3" placeholder="Session Notes (Vibe, Lasagna Energy, etc.)"></textarea>
            </div>
        </section>

        <button onclick="submitSession()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-black py-5 rounded-2xl shadow-xl shadow-sky-900/20 uppercase tracking-[0.2em] text-sm transition-all active:scale-95 mb-12">
            Register Sprint 2 Log
        </button>
    </main>

    <main id="view-history" class="hidden space-y-4">
        <div id="history-container" class="space-y-4"></div>
        <button onclick="copyAllLogs()" class="w-full py-4 bg-slate-800 text-xs font-bold rounded-xl uppercase">Copy All Data</button>
    </main>

    <script>
        const joints = ['Knee', 'Elbow', 'Shoulder'];
        const sspOptions = {
            Sound: ['Silent', 'Pop', 'Click', 'Grit'],
            Sensation: ['Smooth', 'Slip', 'Tight', 'Unstable']
        };

        const todayWorkout = {
            block1: [
                { name: 'Ankle Wall Drives', bench: '3x10-12 (5.5" Cap)', null: 'Heel Lift / Knee Cave', cue: 'Short Foot → Medial Pull', recovery: 'Seated Knee Int. Rotation', bilateral: true },
                { name: 'Deep Squat Holds', bench: '3x45-60s', null: 'Butt-Wink / Weight Shift Out', cue: 'Pelvis is a Bowl of Water', recovery: 'Box Breathing (4-4-4-4)' }
            ],
            block2: [
                { name: 'Planche Leans', bench: '3x15-20s', null: 'Scap Winging / Elbow Bend', cue: 'Protraction Priority', recovery: 'Grip-Flush (Reverse Prayer)' },
                { name: 'Crow Pose Toe-Taps', bench: '3x5-8 Tap ea.', null: 'Head Drop / Tricep Gap', cue: 'The Teeter-Totter Weight Shift', recovery: 'Wrist Flossing', bilateral: true }
            ]
        };

        function init() {
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'}).toUpperCase();
            renderJointMatrices('pre');
            renderJointMatrices('post');
            renderBlock('block-1-list', todayWorkout.block1, 0);
            renderBlock('block-2-list', todayWorkout.block2, 10);
            loadHistory();
        }

        function renderJointMatrices(phase) {
            const container = document.getElementById(`${phase}-ssp-container`);
            joints.forEach(joint => {
                const div = document.createElement('div');
                div.className = "space-y-3";
                div.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-800 pb-1 mb-2">
                        <span class="text-[10px] font-black tracking-tighter text-slate-400 uppercase">${joint} Audit</span>
                        <div class="flex items-center gap-2">
                             <span id="${phase}-${joint}-pain-val" class="text-[10px] font-black text-emerald-400">0</span>
                        </div>
                    </div>
                    <div class="ssp-matrix-grid">
                        <div class="matrix-col"><div class="grid grid-cols-2 gap-1" id="${phase}-${joint}-sound">
                            ${sspOptions.Sound.map((s,i) => `<button class="btn-toggle ${i===0?'active':''}" onclick="setToggle(this)">${s}</button>`).join('')}
                        </div></div>
                        <div class="matrix-col"><div class="grid grid-cols-2 gap-1" id="${phase}-${joint}-sens">
                            ${sspOptions.Sensation.map((s,i) => `<button class="btn-toggle ${i===0?'active':''}" onclick="setToggle(this)">${s}</button>`).join('')}
                        </div></div>
                    </div>
                    <input type="range" min="0" max="3" value="0" id="${phase}-${joint}-pain-slider" class="pain-slider pain-0 w-full mt-2" oninput="updatePainSlider(this, '${phase}-${joint}-pain-val')">
                `;
                container.appendChild(div);
            });
        }

        function updatePainSlider(el, valId) {
            const val = el.value;
            const display = document.getElementById(valId);
            display.innerText = val;
            el.className = `pain-slider pain-${val} w-full mt-2`;
            display.className = `text-[10px] font-black ${val==0?'text-emerald-400':val==3?'text-red-500':'text-yellow-400'}`;
        }

        function renderBlock(elementId, exercises, baseIdx) {
            const container = document.getElementById(elementId);
            exercises.forEach((ex, idx) => {
                const globalIdx = baseIdx + idx;
                const div = document.createElement('div');
                div.className = "space-y-4";
                
                let setInputs = '';
                for(let s=1; s<=4; s++) {
                    if(ex.bilateral) {
                        setInputs += `
                        <div class="grid grid-cols-4 gap-2 items-center">
                            <span class="text-[9px] font-bold text-slate-700">SET ${s}</span>
                            <div class="flex gap-1"><input type="number" id="ex-${globalIdx}-s${s}-l-v" placeholder="L" class="w-1/2 p-1 text-center"><input type="number" id="ex-${globalIdx}-s${s}-l-z" placeholder="0" class="w-1/2 p-1 text-center zero-input"></div>
                            <div class="flex gap-1"><input type="number" id="ex-${globalIdx}-s${s}-r-v" placeholder="R" class="w-1/2 p-1 text-center"><input type="number" id="ex-${globalIdx}-s${s}-r-z" placeholder="0" class="w-1/2 p-1 text-center zero-input"></div>
                            <div class="flex justify-center"><input type="checkbox" id="ex-${globalIdx}-s${s}-aha" class="gold-check"></div>
                        </div>`;
                    } else {
                        setInputs += `
                        <div class="grid grid-cols-3 gap-2 items-center">
                            <span class="text-[9px] font-bold text-slate-700">SET ${s}</span>
                            <div class="flex gap-1"><input type="number" id="ex-${globalIdx}-s${s}-v" placeholder="Val" class="w-1/2 p-1 text-center"><input type="number" id="ex-${globalIdx}-s${s}-z" placeholder="0" class="w-1/2 p-1 text-center zero-input"></div>
                            <div class="flex justify-center"><input type="checkbox" id="ex-${globalIdx}-s${s}-aha" class="gold-check"></div>
                        </div>`;
                    }
                }

                div.innerHTML = `
                    <div class="border-b border-slate-800 pb-2">
                        <h5 class="text-sm font-black text-slate-100">${ex.name}</h5>
                        <div class="text-[8px] flex flex-col gap-0.5 mt-1">
                            <span class="text-sky-400 font-bold uppercase">Cue: ${ex.cue}</span>
                            <span class="text-emerald-500 uppercase font-bold">Goal: ${ex.bench}</span>
                            <span class="text-rose-500 uppercase font-bold">Null: ${ex.null}</span>
                            <span class="text-slate-500 uppercase">Recovery: ${ex.recovery}</span>
                        </div>
                    </div>
                    ${ex.bilateral ? `<div class="grid grid-cols-4 gap-2 text-[7px] font-black text-slate-600 text-center uppercase"><div></div><div>L: R/Z</div><div>R: R/Z</div><div>Aha</div></div>` : `<div class="grid grid-cols-3 gap-2 text-[7px] font-black text-slate-600 text-center uppercase"><div></div><div>Score/Zero</div><div>Aha</div></div>`}
                    ${setInputs}
                    <textarea id="ex-${globalIdx}-note" rows="1" placeholder="Feel / Progress..." class="text-[10px] opacity-40"></textarea>
                `;
                container.appendChild(div);
            });
        }

        function setToggle(btn) {
            btn.parentElement.querySelectorAll('.btn-toggle').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function showTab(tab) {
            document.getElementById('view-session').classList.toggle('hidden', tab !== 'session');
            document.getElementById('view-history').classList.toggle('hidden', tab !== 'history');
            document.getElementById('nav-session').classList.toggle('tab-active', tab === 'session');
            document.getElementById('nav-history').classList.toggle('tab-active', tab === 'history');
        }

        function getSSP(phase) {
            return joints.map(j => {
                const s = document.getElementById(`${phase}-${j}-sound`).querySelector('.active').innerText;
                const sen = document.getElementById(`${phase}-${j}-sens`).querySelector('.active').innerText;
                const p = document.getElementById(`${phase}-${j}-pain-slider`).value;
                return `${j}:[${s}/${sen}/P:${p}]`;
            }).join(' | ');
        }

        function submitSession() {
            let log = `[REGISTERED_LOG: SPRINT_2_V1.2]
Date: ${new Date().toLocaleString()}
I. PRE: ${getSSP('pre')}
Notes: ${document.getElementById('pre-notes').value || 'N/A'}

II. WORKOUT REPORT
Warmup: ${document.getElementById('warmup-check').checked ? 'DONE' : 'SKIPPED'}\n`;

            [...todayWorkout.block1, ...todayWorkout.block2].forEach((ex, idx) => {
                let actualIdx = idx < todayWorkout.block1.length ? idx : idx + 10 - todayWorkout.block1.length;
                let sets = [];
                for(let s=1; s<=4; s++) {
                    const aha = document.getElementById(`ex-${actualIdx}-s${s}-aha`).checked ? "★" : "";
                    if(ex.bilateral) {
                        const lv = document.getElementById(`ex-${actualIdx}-s${s}-l-v`).value;
                        const rv = document.getElementById(`ex-${actualIdx}-s${s}-r-v`).value;
                        if(lv || rv) sets.push(`S${s}: L ${lv}/${document.getElementById(`ex-${actualIdx}-s${s}-l-z`).value}, R ${rv}/${document.getElementById(`ex-${actualIdx}-s${s}-r-z`).value}${aha}`);
                    } else {
                        const v = document.getElementById(`ex-${actualIdx}-s${s}-v`).value;
                        if(v) sets.push(`S${s}: ${v}/${document.getElementById(`ex-${actualIdx}-s${s}-z`).value}${aha}`);
                    }
                }
                if(sets.length) log += `${ex.name}: ${sets.join(' | ')} (${document.getElementById(`ex-${actualIdx}-note`).value})\n`;
            });

            log += `\nIII. POST: ${getSSP('post')}
MG Shield: ${document.getElementById('mg-shield').value}
Session Notes: ${document.getElementById('post-notes').value || 'N/A'}`;

            let arc = JSON.parse(localStorage.getItem('david_s2_archive') || '[]');
            arc.unshift(log);
            localStorage.setItem('david_s2_archive', JSON.stringify(arc));
            location.reload();
        }

        function loadHistory() {
            const logs = JSON.parse(localStorage.getItem('david_s2_archive') || '[]');
            document.getElementById('history-container').innerHTML = logs.map((l, i) => `
                <div class="card p-3 font-mono text-[9px] whitespace-pre-wrap border-slate-800">
                    ${l.replace(/</g, '&lt;')}
                </div>
            `).join('');
        }

        function copyAllLogs() {
            const logs = JSON.parse(localStorage.getItem('david_s2_archive') || '[]');
            navigator.clipboard.writeText(logs.join('\n\n---\n\n'));
            alert("Copied.");
        }

        init();
    </script>
</body>
</html>
