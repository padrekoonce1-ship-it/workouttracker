<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>2026 Lexicon Logger</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html { font-size: 18px; } 
        body {
            background-color: #000000; color: #ffffff;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .card { background: #111; border: 1px solid #222; }
        .slider {
            -webkit-appearance: none; width: 100%; height: 8px;
            border-radius: 5px; background: #333; outline: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 32px; height: 32px;
            border-radius: 50%; background: #3b82f6; cursor: pointer;
        }
        .btn-lexicon {
            padding: 10px; border-radius: 12px; background: #1a1a1a;
            border: 1px solid #333; font-weight: bold; font-size: 0.75rem;
            text-align: center; color: #71717a; transition: all 0.2s ease;
        }
        .btn-lexicon.active { background: #3b82f6; border-color: #3b82f6; color: white; }
        .btn-choice {
            padding: 14px; border-radius: 14px; background: #1a1a1a;
            border: 1px solid #333; font-weight: bold; font-size: 0.85rem;
        }
        .btn-choice.active-green { background: #22c55e; color: white; border-color: #22c55e; }
        .btn-choice.active-red { background: #ef4444; color: white; border-color: #ef4444; }
        
        .tab-active { color: #3b82f6; border-bottom: 3px solid #3b82f6; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 pb-40 md:max-w-lg md:mx-auto">

    <header class="mb-4 flex justify-between items-start">
        <div>
            <h1 id="routine-display" class="text-2xl font-black text-blue-500 italic uppercase">Loading...</h1>
            <p id="current-date" class="text-zinc-500 font-mono text-xs uppercase"></p>
        </div>
        <div id="save-status" class="text-[9px] font-bold text-zinc-700 bg-zinc-900 px-2 py-1 rounded">AUTO-SAVE: ON</div>
    </header>

    <nav class="flex border-b border-zinc-800 mb-6 sticky top-0 bg-black z-20">
        <button onclick="switchTab('active')" id="tab-active" class="flex-1 py-3 text-sm font-bold uppercase tracking-wider tab-active">Session</button>
        <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-3 text-sm font-bold uppercase tracking-wider text-zinc-500">History Log</button>
    </nav>

    <!-- ACTIVE SESSION VIEW -->
    <main id="view-active" class="block space-y-10">
        
        <!-- I. PRE-WORKOUT REPORT -->
        <section class="space-y-4">
            <h2 class="text-blue-400 font-black text-xs uppercase tracking-[0.2em] pl-1">I. [PRE-WORKOUT_REPORT]</h2>
            <div class="card rounded-3xl p-6 space-y-8">
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-bold mb-3 uppercase text-zinc-500">MG Fatigue</label>
                        <input type="range" min="1" max="5" value="1" class="slider" id="mg-fatigue" oninput="save()">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold mb-3 uppercase text-zinc-500">Readiness</label>
                        <input type="range" min="1" max="5" value="5" class="slider" id="readiness" oninput="save()">
                    </div>
                </div>

                <div class="space-y-4">
                    <label class="block text-[10px] font-bold uppercase text-zinc-500">Nutrition Targets</label>
                    <div class="grid grid-cols-2 gap-3">
                        <select id="pre-hydration" class="bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-sm" onchange="save()">
                            <option value="On Target">Hydration: On Target</option>
                            <option value="Below Target">Hydration: Below</option>
                            <option value="Above Target">Hydration: Above</option>
                        </select>
                        <select id="pre-protein" class="bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-sm" onchange="save()">
                            <option value="130g Protein">130g Protein: On</option>
                            <option value="Below 130g">130g Protein: Below</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="block text-[10px] font-bold uppercase text-zinc-500">[VIBE] Lexicon</label>
                    <div class="grid grid-cols-2 gap-2" id="vibe-container">
                        <button onclick="toggleLexicon('vibe', 'LEAN & CLEAN')" class="btn-lexicon">LEAN & CLEAN</button>
                        <button onclick="toggleLexicon('vibe', 'SILENT STERNUM')" class="btn-lexicon">SILENT STERNUM</button>
                        <button onclick="toggleLexicon('vibe', 'FATIGUED')" class="btn-lexicon">FATIGUED</button>
                        <button onclick="toggleLexicon('vibe', 'BRONCHIAL LOAD')" class="btn-lexicon">BRONCHIAL LOAD</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- II. WORKOUT REPORT -->
        <section class="space-y-4">
            <h2 class="text-blue-400 font-black text-xs uppercase tracking-[0.2em] pl-1">II. [WORKOUT_REPORT]</h2>
            <div class="card rounded-3xl p-6 mb-4">
                <label class="block text-[10px] font-bold uppercase text-zinc-500 mb-3">Primary [FOCUS]</label>
                <div class="grid grid-cols-2 gap-2" id="focus-container">
                    <button onclick="toggleLexicon('focus', 'STERNAL INTEGRITY')" class="btn-lexicon">STERNAL INTEGRITY</button>
                    <button onclick="toggleLexicon('focus', 'SCAPULAR TRACKING')" class="btn-lexicon">SCAPULAR TRACKING</button>
                    <button onclick="toggleLexicon('focus', 'KNEE SANCTUARY')" class="btn-lexicon">KNEE SANCTUARY</button>
                    <button onclick="toggleLexicon('focus', 'RIB-KNIT')" class="btn-lexicon">RIB-KNIT</button>
                </div>
            </div>
            <div id="workout-content" class="space-y-8"></div>
        </section>

        <!-- III. POST-WORKOUT REPORT -->
        <section class="space-y-4">
            <h2 class="text-blue-400 font-black text-xs uppercase tracking-[0.2em] pl-1">III. [POST-WORKOUT_REPORT]</h2>
            <div class="card rounded-3xl p-6 space-y-8">
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-2">
                        <label class="block text-[10px] font-bold uppercase text-zinc-500 text-center">Right Knee Pain</label>
                        <div class="flex space-x-2">
                            <button onclick="setKnee(false)" id="k-no" class="flex-1 btn-choice active-green">NO</button>
                            <button onclick="setKnee(true)" id="k-yes" class="flex-1 btn-choice">YES</button>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[10px] font-bold uppercase text-zinc-500 text-center">Iso-FUJI Dose</label>
                        <div class="flex items-center justify-center space-x-4 bg-zinc-900 rounded-xl p-2 h-[54px] border border-zinc-800">
                            <button onclick="adjFuji(-1)" class="text-blue-500 font-bold text-xl px-2">-</button>
                            <span id="fuji-count" class="font-black text-lg">1</span>
                            <button onclick="adjFuji(1)" class="text-blue-500 font-bold text-xl px-2">+</button>
                        </div>
                    </div>
                </div>

                <div class="space-y-4">
                    <label class="block text-[10px] font-bold uppercase text-zinc-500">Safety Cues & Recovery</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="toggleLexicon('cue', '90-degree Limit')" class="btn-lexicon">90-deg Limit</button>
                        <button onclick="toggleLexicon('cue', 'Top-down contact')" class="btn-lexicon">Top-down</button>
                        <button onclick="toggleLexicon('cue', 'V-to-W Slide')" class="btn-lexicon">V-to-W Slide</button>
                        <button onclick="toggleLexicon('cue', 'Magnesium')" class="btn-lexicon">Magnesium</button>
                    </div>
                </div>

                <textarea id="notes" placeholder="NOTES: (e.g., No bronchial interference...)" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl p-4 text-sm focus:outline-none focus:border-blue-900" rows="3" oninput="save()"></textarea>
            </div>
        </section>

        <button onclick="logSession()" class="w-full py-5 bg-blue-600 text-white font-black rounded-3xl shadow-2xl shadow-blue-900/40 uppercase tracking-widest text-lg active:scale-95 transition-transform">
            Log Session
        </button>
    </main>

    <!-- HISTORY VIEW -->
    <main id="view-history" class="hidden space-y-6">
        <div class="flex justify-between items-center">
            <h2 class="text-xl font-black italic">MEMORY LOCKER</h2>
            <button onclick="clearHistory()" class="text-[10px] text-red-500 font-bold uppercase">Clear All</button>
        </div>
        <div id="history-container" class="space-y-4"></div>
        <button onclick="copyHistory()" class="w-full py-4 bg-zinc-100 text-black font-black rounded-2xl uppercase text-xs">
            Copy Lexicon Logs
        </button>
    </main>

    <script>
        const routines = {
            'STRENGTH & ALIGNMENT': { 
                days: [0, 2, 4], // Sun, Tue, Thu
                focus: 'STERNAL INTEGRITY',
                exercises: [
                    { name: "Scapular Pull-ups", sub: "(Naked/Slings)", target: "10r" },
                    { name: "Hollow Body", sub: "Hold", target: "45s" },
                    { name: "Banded Leg Alignment", sub: "", target: "15r" }
                ],
                rounds: 3
            },
            'MOBILITY & SKILLS': {
                days: [1, 3], // Mon, Wed
                focus: 'PELVIC NEUTRALITY',
                structure: 'special'
            },
            'REST / RECOVERY': {
                days: [5, 6], // Fri, Sat
                focus: 'KNEE SANCTUARY',
                structure: 'rest'
            }
        };

        let currentType = '';
        let activeVibes = [];
        let activeFocus = [];
        let activeCues = [];
        let hasKneePain = false;
        let fujiDose = 1;

        function init() {
            const day = new Date().getDay();
            for (let k in routines) {
                if (routines[k].days.includes(day)) {
                    currentType = k;
                    break;
                }
            }

            document.getElementById('routine-display').innerText = currentType;
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            
            renderWorkout();
            load();
        }

        function renderWorkout() {
            const container = document.getElementById('workout-content');
            const data = routines[currentType];
            let html = "";

            if (data.structure === 'rest') {
                html = `<div class="card p-6 rounded-2xl text-center italic text-zinc-500 text-sm">Active Recovery / Rest Day. Focus on systemic recovery.</div>`;
            } else if (data.structure === 'special') {
                html = `
                    <div class="space-y-4">
                        <div class="flex items-center space-x-2"><h2 class="text-[10px] font-black text-zinc-800 uppercase">Block 1: Initial</h2><span class="h-px flex-1 bg-zinc-900"></span></div>
                        ${[1,2,3].map(r => renderEx({name:"Ankle Wall Drives", sub:"", target:"15r"}, r)).join('')}
                        <div class="flex items-center space-x-2 mt-6"><h2 class="text-[10px] font-black text-zinc-800 uppercase">Block 2: Supersets</h2><span class="h-px flex-1 bg-zinc-900"></span></div>
                        ${[1,2,3,4,5].map(r => `
                            ${renderEx({name:"Planche Leans", sub:"", target:"30s"}, r)}
                            ${renderEx({name:"90/90 Hip Openers", sub:"", target:"30s"}, r)}
                        `).join('')}
                    </div>`;
            } else {
                for (let r = 1; r <= data.rounds; r++) {
                    html += `<div class="space-y-4">
                        <div class="flex items-center space-x-2"><h2 class="text-[10px] font-black text-zinc-800 uppercase">Circuit Round ${r}</h2><span class="h-px flex-1 bg-zinc-900"></span></div>
                        ${data.exercises.map(ex => renderEx(ex, r)).join('')}
                    </div>`;
                }
            }
            container.innerHTML = html;
        }

        function renderEx(ex, r) {
            const id = `${r}-${ex.name}`;
            return `<div class="card rounded-2xl p-4">
                <div class="flex items-center justify-between mb-2">
                    <div>
                        <h3 class="text-sm font-bold text-zinc-200">${ex.name} <span class="text-[10px] text-zinc-600 font-normal">${ex.sub}</span></h3>
                        <p class="text-[10px] text-zinc-500 font-bold uppercase">${ex.target}</p>
                    </div>
                    <input type="checkbox" class="round-check w-8 h-8 rounded-xl bg-zinc-900 border-zinc-800 accent-blue-600" data-id="${id}" onchange="save()">
                </div>
                <input type="text" placeholder="Notes..." class="round-note w-full bg-zinc-950 border border-zinc-900 rounded-xl p-2 text-xs text-zinc-400 focus:outline-none" data-id="n-${id}" oninput="save()">
            </div>`;
        }

        function toggleLexicon(type, val) {
            let list = type === 'vibe' ? activeVibes : type === 'focus' ? activeFocus : activeCues;
            const idx = list.indexOf(val);
            if (idx > -1) list.splice(idx, 1); else list.push(val);
            
            // UI Update
            const containerId = type === 'vibe' ? 'vibe-container' : type === 'focus' ? 'focus-container' : 'view-active';
            document.querySelectorAll(`.btn-lexicon`).forEach(btn => {
                if (btn.innerText === val || (btn.innerText === '90-deg Limit' && val === '90-degree Limit')) {
                    btn.classList.toggle('active');
                }
            });
            save();
        }

        function setKnee(val) {
            hasKneePain = val;
            document.getElementById('k-yes').className = val ? 'flex-1 btn-choice active-red' : 'flex-1 btn-choice';
            document.getElementById('k-no').className = !val ? 'flex-1 btn-choice active-green' : 'flex-1 btn-choice';
            document.getElementById('knee-notes-container').style.display = val ? 'block' : 'none';
            save();
        }

        function adjFuji(amt) {
            fujiDose = Math.max(0, fujiDose + amt);
            document.getElementById('fuji-count').innerText = fujiDose;
            save();
        }

        function save() {
            const state = {
                mg: document.getElementById('mg-fatigue').value,
                rd: document.getElementById('readiness').value,
                hyd: document.getElementById('pre-hydration').value,
                pro: document.getElementById('pre-protein').value,
                knee: hasKneePain,
                kneeN: document.getElementById('knee-notes')?.value || "",
                fuji: fujiDose,
                vibes: activeVibes,
                focus: activeFocus,
                cues: activeCues,
                notes: document.getElementById('notes').value,
                checks: {},
                exNotes: {}
            };
            document.querySelectorAll('.round-check').forEach(c => state.checks[c.dataset.id] = c.checked);
            document.querySelectorAll('.round-note').forEach(n => state.exNotes[n.dataset.id] = n.value);
            localStorage.setItem('lexicon_state_v1', JSON.stringify(state));
        }

        function load() {
            const saved = localStorage.getItem('lexicon_state_v1');
            if (!saved) { setKnee(false); return; }
            const s = JSON.parse(saved);
            document.getElementById('mg-fatigue').value = s.mg;
            document.getElementById('readiness').value = s.rd;
            document.getElementById('pre-hydration').value = s.hyd;
            document.getElementById('pre-protein').value = s.pro;
            setKnee(s.knee);
            fujiDose = s.fuji;
            document.getElementById('fuji-count').innerText = fujiDose;
            document.getElementById('notes').value = s.notes || "";
            activeVibes = s.vibes || [];
            activeFocus = s.focus || [];
            activeCues = s.cues || [];

            // Reset Lexicon Button Classes
            document.querySelectorAll('.btn-lexicon').forEach(btn => {
                const txt = btn.innerText === '90-deg Limit' ? '90-degree Limit' : btn.innerText;
                if (activeVibes.includes(txt) || activeFocus.includes(txt) || activeCues.includes(txt)) btn.classList.add('active');
            });

            document.querySelectorAll('.round-check').forEach(c => c.checked = s.checks[c.dataset.id] || false);
            document.querySelectorAll('.round-note').forEach(n => n.value = s.exNotes[n.dataset.id] || "");
        }

        function logSession() {
            const stamp = new Date().toISOString();
            const metrics = [];
            document.querySelectorAll('.round-check').forEach(c => {
                if (c.checked) {
                    const note = document.querySelector(`[data-id="n-${c.dataset.id}"]`).value;
                    metrics.push(`${c.dataset.id.split('-')[1]}: ${note || '1 set'}`);
                }
            });

            const output = `<WORKOUT_LOG>
[TIMESTAMP]: ${stamp}
[TYPE]: ${currentType}
[FOCUS]: ${activeFocus.join(', ') || 'NONE'}
[METRICS]: ${metrics.join('. ')}. Iso-FUJI: ${fujiDose} dose. Hydration: ${document.getElementById('pre-hydration').value}. Protein: ${document.getElementById('pre-protein').value}. ${activeCues.join(', ')}
[VIBE]: ${activeVibes.join(', ') || 'NEUTRAL'}
NOTES: ${document.getElementById('notes').value || 'None'}. Knee Pain: ${hasKneePain ? 'YES' : 'NO'}.
</WORKOUT_LOG>`;

            const history = JSON.parse(localStorage.getItem('lex_history') || "[]");
            history.unshift(output);
            localStorage.setItem('lex_history', JSON.stringify(history));
            localStorage.removeItem('lexicon_state_v1');
            alert("Session Locked to Memory.");
            location.reload();
        }

        function switchTab(t) {
            document.getElementById('view-active').style.display = t === 'active' ? 'block' : 'none';
            document.getElementById('view-history').style.display = t === 'history' ? 'block' : 'none';
            document.getElementById('tab-active').className = t === 'active' ? 'flex-1 py-3 text-sm font-bold tab-active' : 'flex-1 py-3 text-sm font-bold text-zinc-500';
            document.getElementById('tab-history').className = t === 'history' ? 'flex-1 py-3 text-sm font-bold tab-active' : 'flex-1 py-3 text-sm font-bold text-zinc-500';
            if (t === 'history') updateHistory();
        }

        function updateHistory() {
            const h = JSON.parse(localStorage.getItem('lex_history') || "[]");
            const container = document.getElementById('history-container');
            container.innerHTML = h.map(log => `
                <div class="card p-4 rounded-2xl text-[10px] font-mono whitespace-pre-wrap leading-relaxed text-zinc-400">
                    ${log.replace(/</g, '&lt;').replace(/>/g, '&gt;')}
                </div>
            `).join('');
        }

        function copyHistory() {
            const h = JSON.parse(localStorage.getItem('lex_history') || "[]");
            if (h.length === 0) return;
            const el = document.createElement('textarea');
            el.value = h.join('\n\n');
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert("Copied all logs.");
        }

        function clearHistory() { if (confirm("Clear all logs?")) { localStorage.setItem('lex_history', "[]"); updateHistory(); } }

        init();
    </script>
</body>
</html>
