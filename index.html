<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 2 Integrity Tracker V1.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #f1f5f9; font-family: ui-sans-serif, system-ui, sans-serif; }
        .tab-active { border-bottom: 2px solid #38bdf8; color: #38bdf8; }
        .card { background-color: #0f172a; border-radius: 1rem; padding: 1.25rem; margin-bottom: 1.25rem; border: 1px solid #1e293b; transition: all 0.3s; }
        .btn-toggle { padding: 0.5rem; border-radius: 0.4rem; background: #1e293b; font-size: 0.65rem; transition: all 0.2s; cursor: pointer; text-align: center; border: 1px solid transparent; font-weight: 600; color: #94a3b8; }
        .btn-toggle.active { background: #38bdf8; color: #020617; font-weight: 900; border-color: #7dd3fc; }
        input, textarea, select { background: #020617; border: 1px solid #1e293b; color: white; border-radius: 0.5rem; padding: 0.6rem; width: 100%; font-size: 0.875rem; }
        label { display: block; margin-bottom: 0.35rem; font-size: 0.7rem; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.1em; }
        
        /* SSP Pain Slider Styling */
        .pain-slider { -webkit-appearance: none; height: 6px; border-radius: 5px; outline: none; transition: background 0.3s; }
        .pain-0 { background: #22c55e !important; } /* Green */
        .pain-1, .pain-2 { background: #eab308 !important; } /* Yellow */
        .pain-3 { background: #ef4444 !important; } /* Red */
        .pain-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #ffffff; cursor: pointer; border: 2px solid #0f172a; }

        .zero-input { color: #ef4444; font-weight: 800; border-color: #450a0a; }
        .gold-check { width: 1.25rem; height: 1.25rem; accent-color: #fbbf24; cursor: pointer; }
        .ssp-matrix-grid { display: grid; grid-template-cols: 1fr 1fr; gap: 0.75rem; }
        .matrix-col { display: flex; flex-direction: column; gap: 0.25rem; }
    </style>
</head>
<body class="max-w-md mx-auto p-4 pb-32">

    <header class="mb-6 flex justify-between items-end">
        <div>
            <h1 class="text-[10px] font-black text-sky-500 tracking-[0.3em] uppercase">Sprint 2 • Block 1</h1>
            <h2 id="routine-title" class="text-2xl font-bold tracking-tight">Loading...</h2>
        </div>
        <div id="current-date" class="text-[10px] font-mono bg-slate-800 px-2 py-1 rounded text-slate-400"></div>
    </header>

    <nav class="flex border-b border-slate-800 mb-6 sticky top-0 bg-[#020617]/95 backdrop-blur-sm z-30">
        <button id="nav-session" class="flex-1 py-4 text-xs font-black tab-active" onclick="showTab('session')">SESSION</button>
        <button id="nav-history" class="flex-1 py-4 text-xs font-black text-slate-500" onclick="showTab('history')">LOG ARCHIVE</button>
    </nav>

    <main id="view-session">
        
        <!-- SECTION I: PRE-WORKOUT SSP AUDIT -->
        <section class="card border-t-2 border-t-sky-500">
            <h3 class="text-xs font-black mb-4 tracking-widest text-sky-400">I. PRE-WORKOUT SSP AUDIT</h3>
            <div id="pre-ssp-container" class="space-y-8">
                <!-- Joint Matrices Injected Here -->
            </div>
            <div class="mt-6 pt-4 border-t border-slate-800">
                <label>Pre-Session Vibe</label>
                <textarea id="pre-notes" rows="1" placeholder="Current baseline notes..."></textarea>
            </div>
        </section>

        <!-- SECTION II: WORKOUT REPORT -->
        <section class="card border-t-2 border-t-emerald-500">
            <h3 class="text-xs font-black mb-4 tracking-widest text-emerald-400">II. WORKOUT REPORT</h3>
            
            <div class="mb-8 bg-slate-900/50 p-4 rounded-xl border border-slate-800">
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="warmup-check" class="w-5 h-5 accent-emerald-500">
                    <label for="warmup-check" class="m-0 text-white font-bold normal-case text-sm">Optimized Warmup Done</label>
                </div>
            </div>

            <div id="exercise-list" class="space-y-12">
                <!-- Exercises Injected Here -->
            </div>
        </section>

        <!-- SECTION III: POST-WORKOUT REPORT -->
        <section class="card border-t-2 border-t-rose-500">
            <h3 class="text-xs font-black mb-4 tracking-widest text-rose-400">III. POST-WORKOUT FEEDBACK</h3>
            
            <div class="mb-8 bg-slate-900/40 p-4 rounded-xl">
                <label class="text-sky-400">MG Status (The Shield)</label>
                <input type="range" id="mg-shield" min="1" max="5" value="1" class="accent-sky-500 mt-2" oninput="document.getElementById('shield-val').innerText = this.value">
                <div class="flex justify-between text-[9px] font-bold mt-1 uppercase text-slate-500">
                    <span>1: Full Power</span>
                    <span id="shield-val" class="text-sky-400">1</span>
                    <span>5: Symptomatic</span>
                </div>
            </div>

            <div id="post-ssp-container" class="space-y-8">
                <!-- Joint Matrices Injected Here -->
            </div>

            <div class="mt-8">
                <label>Session Notes (Aha! Moments & Vibes)</label>
                <textarea id="post-notes" rows="3" placeholder="How did the recruitment feel?"></textarea>
            </div>
        </section>

        <button onclick="submitSession()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-black py-5 rounded-2xl shadow-xl shadow-sky-900/20 uppercase tracking-[0.2em] text-sm transition-all active:scale-95 mb-12">
            Register Sprint 2 Log
        </button>
    </main>

    <!-- HISTORY VIEW -->
    <main id="view-history" class="hidden space-y-4">
        <div id="history-container" class="space-y-4"></div>
        <button onclick="copyAllLogs()" class="w-full py-4 bg-slate-800 text-xs font-bold rounded-xl uppercase">Copy Data Archive</button>
    </main>

    <script>
        const joints = ['Knee', 'Elbow', 'Shoulder'];
        const sspOptions = {
            Sound: ['Silent', 'Pop', 'Click', 'Grit'],
            Sensation: ['Smooth', 'Slip', 'Tight', 'Unstable']
        };

        const architecture = {
            'Tue': { type: 'Strength & Alignment', focus: 'POSTERIOR RECRUITMENT', ex: [
                { name: 'Scapular Pull-ups', bench: '10 Reps (2-2-1)', null: 'Shrugging / Loss of Lat Flare' },
                { name: 'Hollow Body Holds', bench: '40-45s', null: 'Rib Flare / L-Back Arch' },
                { name: 'Superman Holds', bench: '30s', null: 'Breath Holding / No Glute Engagement' },
                { name: 'Banded Leg Alignment', bench: '15 Reps (90°)', null: 'Knee Cave / Arch Collapse' }
            ]},
            'Thu': { type: 'Strength & Alignment', focus: 'POSTERIOR RECRUITMENT', ex: [
                { name: 'Scapular Pull-ups', bench: '10 Reps (2-2-1)', null: 'Shrugging / Loss of Lat Flare' },
                { name: 'Hollow Body Holds', bench: '40-45s', null: 'Rib Flare / L-Back Arch' },
                { name: 'Superman Holds', bench: '30s', null: 'Breath Holding / No Glute Engagement' },
                { name: 'Banded Leg Alignment', bench: '15 Reps (90°)', null: 'Knee Cave / Arch Collapse' }
            ]},
            'Sun': { type: 'Strength & Alignment', focus: 'POSTERIOR RECRUITMENT', ex: [
                { name: 'Scapular Pull-ups', bench: '10 Reps (2-2-1)', null: 'Shrugging / Loss of Lat Flare' },
                { name: 'Hollow Body Holds', bench: '40-45s', null: 'Rib Flare / L-Back Arch' },
                { name: 'Superman Holds', bench: '30s', null: 'Breath Holding / No Glute Engagement' },
                { name: 'Banded Leg Alignment', bench: '15 Reps (90°)', null: 'Knee Cave / Arch Collapse' }
            ]},
            'Mon': { type: 'Mobility & Skills', focus: 'CENTER-OF-MASS CALIBRATION', ex: [
                { name: 'Crow Pose Toe-Taps', bench: '30s Total', null: 'Elbow Flare / Collapse' },
                { name: 'Deep Squat Holds', bench: '1 Minute', null: 'Heel Lift / Knee Cave / Butt Wink' },
                { name: 'Ankle Wall Drives', bench: '10ea (5-count)', null: 'Heel Daylight / Midline Drift', bilateral: true }
            ]},
            'Wed': { type: 'Mobility & Skills', focus: 'CENTER-OF-MASS CALIBRATION', ex: [
                { name: 'Crow Pose Toe-Taps', bench: '30s Total', null: 'Elbow Flare / Collapse' },
                { name: 'Deep Squat Holds', bench: '1 Minute', null: 'Heel Lift / Knee Cave / Butt Wink' },
                { name: 'Ankle Wall Drives', bench: '10ea (5-count)', null: 'Heel Daylight / Midline Drift', bilateral: true }
            ]},
            'Fri': { type: 'Active Recovery', focus: 'SYSTEMIC CALM', ex: [] },
            'Sat': { type: 'Active Recovery', focus: 'SYSTEMIC CALM', ex: [] }
        };

        const todayKey = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date().getDay()];
        const workout = architecture[todayKey];

        function init() {
            document.getElementById('routine-title').innerText = workout.type;
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'}).toUpperCase();
            
            renderJointMatrices('pre');
            renderJointMatrices('post');
            renderExercises();
            loadHistory();
        }

        function renderJointMatrices(phase) {
            const container = document.getElementById(`${phase}-ssp-container`);
            joints.forEach(joint => {
                const div = document.createElement('div');
                div.className = "space-y-3";
                div.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-800 pb-1 mb-2">
                        <span class="text-[10px] font-black tracking-tighter text-slate-400 uppercase">${joint} Audit</span>
                        <div class="flex items-center gap-2">
                             <span class="text-[9px] font-bold text-slate-500">PAIN:</span>
                             <span id="${phase}-${joint}-pain-val" class="text-[10px] font-black text-emerald-400">0</span>
                        </div>
                    </div>
                    <div class="ssp-matrix-grid">
                        <div class="matrix-col">
                            <label class="text-[8px] opacity-50">Sound</label>
                            <div class="grid grid-cols-2 gap-1" id="${phase}-${joint}-sound">
                                ${sspOptions.Sound.map((s,i) => `<button class="btn-toggle ${i===0?'active':''}" onclick="setToggle(this)">${s}</button>`).join('')}
                            </div>
                        </div>
                        <div class="matrix-col">
                            <label class="text-[8px] opacity-50">Sensation</label>
                            <div class="grid grid-cols-2 gap-1" id="${phase}-${joint}-sens">
                                ${sspOptions.Sensation.map((s,i) => `<button class="btn-toggle ${i===0?'active':''}" onclick="setToggle(this)">${s}</button>`).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="mt-2">
                        <input type="range" min="0" max="3" value="0" 
                            id="${phase}-${joint}-pain-slider"
                            class="pain-slider pain-0 w-full"
                            oninput="updatePainSlider(this, '${phase}-${joint}-pain-val')">
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function updatePainSlider(el, valId) {
            const val = el.value;
            const display = document.getElementById(valId);
            display.innerText = val;
            
            // Handle Color Coding
            el.classList.remove('pain-0', 'pain-1', 'pain-2', 'pain-3');
            el.classList.add(`pain-${val}`);
            
            // Handle display color
            display.classList.remove('text-emerald-400', 'text-yellow-400', 'text-red-500');
            if(val == 0) display.classList.add('text-emerald-400');
            else if(val == 3) display.classList.add('text-red-500');
            else display.classList.add('text-yellow-400');
        }

        function renderExercises() {
            const list = document.getElementById('exercise-list');
            if (workout.ex.length === 0) {
                list.innerHTML = `<p class="text-center text-slate-500 italic py-12">Rest Day Protocol.</p>`;
                return;
            }

            workout.ex.forEach((ex, exIdx) => {
                const exContainer = document.createElement('div');
                exContainer.className = "space-y-4";
                
                let headers = ex.bilateral ? `
                    <div class="grid grid-cols-4 gap-2 text-[8px] font-black text-slate-600 uppercase text-center">
                        <div>Set</div><div>L: R/Z</div><div>R: R/Z</div><div>Aha!</div>
                    </div>` : `
                    <div class="grid grid-cols-3 gap-2 text-[8px] font-black text-slate-600 uppercase text-center">
                        <div>Set</div><div>Rep / Zero</div><div>Aha!</div>
                    </div>`;

                let setsHtml = '';
                for(let i=1; i<=4; i++) {
                    if (ex.bilateral) {
                        setsHtml += `
                        <div class="grid grid-cols-4 gap-2 items-center">
                            <span class="text-[10px] font-bold text-slate-700 text-center">S${i}</span>
                            <div class="flex gap-1"><input type="number" id="ex-${exIdx}-s${i}-l-v" class="w-1/2 p-1 text-center text-xs"><input type="number" id="ex-${exIdx}-s${i}-l-z" class="w-1/2 p-1 text-center text-xs zero-input"></div>
                            <div class="flex gap-1"><input type="number" id="ex-${exIdx}-s${i}-r-v" class="w-1/2 p-1 text-center text-xs"><input type="number" id="ex-${exIdx}-s${i}-r-z" class="w-1/2 p-1 text-center text-xs zero-input"></div>
                            <div class="flex justify-center"><input type="checkbox" id="ex-${exIdx}-s${i}-aha" class="gold-check"></div>
                        </div>`;
                    } else {
                        setsHtml += `
                        <div class="grid grid-cols-3 gap-2 items-center">
                            <span class="text-[10px] font-bold text-slate-700 text-center">S${i}</span>
                            <div class="flex gap-1"><input type="number" id="ex-${exIdx}-s${i}-v" class="w-1/2 p-1 text-center text-xs"><input type="number" id="ex-${exIdx}-s${i}-z" class="w-1/2 p-1 text-center text-xs zero-input"></div>
                            <div class="flex justify-center"><input type="checkbox" id="ex-${exIdx}-s${i}-aha" class="gold-check"></div>
                        </div>`;
                    }
                }

                exContainer.innerHTML = `
                    <div class="border-b border-slate-800 pb-2">
                        <h4 class="text-sm font-black text-slate-200">${ex.name}</h4>
                        <div class="flex justify-between items-center mt-1">
                            <span class="text-[9px] font-bold text-emerald-500 uppercase tracking-tighter">Bench: ${ex.bench}</span>
                            <span class="text-[9px] font-bold text-rose-500 uppercase tracking-tighter">Null: ${ex.null}</span>
                        </div>
                    </div>
                    ${headers} ${setsHtml}
                    <input type="text" id="ex-${exIdx}-note" placeholder="Exercise notes..." class="text-[10px] mt-1 h-7 opacity-50">
                `;
                list.appendChild(exContainer);
            });
        }

        function setToggle(btn) {
            btn.parentElement.querySelectorAll('.btn-toggle').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function showTab(tab) {
            document.getElementById('view-session').classList.toggle('hidden', tab !== 'session');
            document.getElementById('view-history').classList.toggle('hidden', tab !== 'history');
            document.getElementById('nav-session').classList.toggle('tab-active', tab === 'session');
            document.getElementById('nav-history').classList.toggle('tab-active', tab === 'history');
        }

        function getSSPData(phase) {
            return joints.map(j => {
                const sound = document.getElementById(`${phase}-${j}-sound`).querySelector('.active').innerText;
                const sens = document.getElementById(`${phase}-${j}-sens`).querySelector('.active').innerText;
                const pain = document.getElementById(`${phase}-${j}-pain-slider`).value;
                return `${j}: [${sound}/${sens}/P:${pain}]`;
            }).join(' | ');
        }

        function submitSession() {
            const preSSP = getSSPData('pre');
            const postSSP = getSSPData('post');
            
            let exLog = [];
            workout.ex.forEach((ex, idx) => {
                let setsData = [];
                for(let i=1; i<=4; i++) {
                    const aha = document.getElementById(`ex-${idx}-s${i}-aha`).checked ? "★" : "";
                    if (ex.bilateral) {
                        const lv = document.getElementById(`ex-${idx}-s${i}-l-v`).value;
                        const lz = document.getElementById(`ex-${idx}-s${i}-l-z`).value;
                        const rv = document.getElementById(`ex-${idx}-s${i}-r-v`).value;
                        const rz = document.getElementById(`ex-${idx}-s${i}-r-z`).value;
                        if(lv || rv) setsData.push(`S${i}: L ${lv}/${lz}, R ${rv}/${rz}${aha}`);
                    } else {
                        const v = document.getElementById(`ex-${idx}-s${i}-v`).value;
                        const z = document.getElementById(`ex-${idx}-s${i}-z`).value;
                        if(v) setsData.push(`S${i}: ${v}/${z}${aha}`);
                    }
                }
                const note = document.getElementById(`ex-${idx}-note`).value;
                exLog.push(`${ex.name}: ${setsData.join(' | ')} ${note ? '('+note+')' : ''}`);
            });

            const fullLog = `[REGISTERED_LOG: SPRINT_2_APP_SPEC_V1.1]
Date/Time: ${new Date().toLocaleString()}
I. Pre-Workout SSP: ${preSSP}
Notes: ${document.getElementById('pre-notes').value || 'None'}
II. Workout Report: ${workout.type} (${workout.focus})
Warmup: ${document.getElementById('warmup-check').checked ? 'DONE' : 'SKIPPED'}
${exLog.join('\n')}
III. Post-Workout Report
Notes: ${document.getElementById('post-notes').value || 'None'}
Post-Workout SSP: ${postSSP}
MG Status: ${document.getElementById('mg-shield').value} (1-5 Shield Gauge)`;

            let logs = JSON.parse(localStorage.getItem('david_s2_archive') || '[]');
            logs.unshift(fullLog);
            localStorage.setItem('david_s2_archive', JSON.stringify(logs));
            location.reload();
        }

        function loadHistory() {
            const logs = JSON.parse(localStorage.getItem('david_s2_archive') || '[]');
            const container = document.getElementById('history-container');
            container.innerHTML = logs.map((l, i) => `
                <div class="card p-3 font-mono text-[9px] whitespace-pre-wrap relative border-slate-800">
                    <button onclick="deleteLog(${i})" class="absolute top-2 right-2 text-rose-900 opacity-50 font-black">DEL</button>
                    ${l.replace(/</g, '&lt;').replace(/>/g, '&gt;')}
                </div>
            `).join('');
        }

        function deleteLog(i) {
            if(!confirm("Delete?")) return;
            let logs = JSON.parse(localStorage.getItem('david_s2_archive') || '[]');
            logs.splice(i, 1);
            localStorage.setItem('david_s2_archive', JSON.stringify(logs));
            loadHistory();
        }

        function copyAllLogs() {
            const logs = JSON.parse(localStorage.getItem('david_s2_archive') || '[]');
            navigator.clipboard.writeText(logs.join('\n\n---\n\n'));
            alert("Copied.");
        }

        init();
    </script>
</body>
</html>
