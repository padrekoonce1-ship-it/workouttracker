<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David's Sprint 1 Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .tab-active { border-bottom: 2px solid #38bdf8; color: #38bdf8; }
        .card { background-color: #1e293b; border-radius: 0.75rem; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid #334155; }
        .btn-toggle { padding: 0.5rem 1rem; border-radius: 0.5rem; background: #334155; transition: all 0.2s; }
        .btn-toggle.active { background: #38bdf8; color: #0f172a; font-weight: bold; }
        input, textarea, select { background: #0f172a; border: 1px solid #334155; color: white; border-radius: 0.375rem; padding: 0.5rem; width: 100%; }
        label { display: block; margin-bottom: 0.25rem; font-size: 0.875rem; color: #94a3b8; }
    </style>
</head>
<body class="max-w-md mx-auto p-4 pb-24">

    <!-- Tab Navigation -->
    <div class="flex justify-around mb-6 sticky top-0 bg-[#0f172a] py-4 z-10 border-b border-slate-800">
        <button id="tab-session" class="pb-2 px-4 tab-active font-bold" onclick="switchTab('session')">SESSION</button>
        <button id="tab-history" class="pb-2 px-4 text-slate-400 font-bold" onclick="switchTab('history')">HISTORY LOG</button>
    </div>

    <!-- SESSION TAB -->
    <div id="content-session">
        <h2 class="text-xl font-bold mb-4 text-sky-400" id="workout-title">Loading workout...</h2>

        <!-- Section I: Pre-Workout -->
        <div class="card">
            <h3 class="font-bold mb-3 border-b border-slate-700 pb-1">Pre-Workout Report</h3>
            <div class="space-y-3">
                <div>
                    <label>Energy Level (1-10)</label>
                    <input type="range" id="energy" min="1" max="10" value="7" class="accent-sky-500">
                </div>
                <div>
                    <label>Sleep Quality</label>
                    <div class="flex gap-2">
                        <button class="btn-toggle active flex-1 text-xs" onclick="toggleBtn(this, 'sleep')">Restorative</button>
                        <button class="btn-toggle flex-1 text-xs" onclick="toggleBtn(this, 'sleep')">Interrupted</button>
                    </div>
                </div>
                <div>
                    <label>Readiness Notes</label>
                    <textarea id="pre-notes" rows="2" placeholder="Soreness, stiffness, etc."></textarea>
                </div>
            </div>
        </div>

        <!-- Section II: Workout Report -->
        <div class="card">
            <h3 class="font-bold mb-3 border-b border-slate-700 pb-1">Workout Report</h3>
            
            <!-- Global Warmup -->
            <div class="mb-4 bg-slate-800/50 p-3 rounded-lg border border-slate-700">
                <div class="flex items-center gap-3 mb-2">
                    <input type="checkbox" id="warmup-check" class="w-5 h-5 accent-sky-500">
                    <label for="warmup-check" class="m-0 font-bold text-white">Warmup Completed</label>
                </div>
                <textarea id="warmup-notes" rows="1" placeholder="Warmup specific feedback..."></textarea>
            </div>

            <!-- Exercises Container -->
            <div id="exercise-list" class="space-y-6">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- Section III: Post-Workout -->
        <div class="card">
            <h3 class="font-bold mb-3 border-b border-slate-700 pb-1">Post-Workout Report</h3>
            
            <!-- SSP Scale -->
            <div class="space-y-4 mb-4">
                <p class="text-xs font-bold text-sky-400 uppercase tracking-wider">Knee Metrics (S.S.P. Scale)</p>
                
                <div>
                    <label>Sound (S)</label>
                    <div class="grid grid-cols-4 gap-1" id="ssp-sound">
                        <button class="btn-toggle text-[10px] p-1 active" onclick="setSSP('sound', 'Silent')">Silent</button>
                        <button class="btn-toggle text-[10px] p-1" onclick="setSSP('sound', 'Pop')">Pop</button>
                        <button class="btn-toggle text-[10px] p-1" onclick="setSSP('sound', 'Click')">Click</button>
                        <button class="btn-toggle text-[10px] p-1" onclick="setSSP('sound', 'Grit')">Grit</button>
                    </div>
                </div>

                <div>
                    <label>Sensation (S)</label>
                    <div class="grid grid-cols-4 gap-1" id="ssp-sensation">
                        <button class="btn-toggle text-[10px] p-1 active" onclick="setSSP('sensation', 'Smooth')">Smooth</button>
                        <button class="btn-toggle text-[10px] p-1" onclick="setSSP('sensation', 'Slip')">Slip</button>
                        <button class="btn-toggle text-[10px] p-1" onclick="setSSP('sensation', 'Tight')">Tight</button>
                        <button class="btn-toggle text-[10px] p-1" onclick="setSSP('sensation', 'Unstable')">Unstable</button>
                    </div>
                </div>

                <div>
                    <label>Pain Level (P: 0-10)</label>
                    <input type="range" id="ssp-pain" min="0" max="10" value="0" class="accent-red-500">
                    <div class="flex justify-between text-[10px] text-slate-500 px-1">
                        <span>0 (None)</span><span>10 (Severe)</span>
                    </div>
                </div>
            </div>

            <div class="space-y-3">
                <div>
                    <label>Safety Cues & Recovery</label>
                    <div class="flex gap-2">
                        <button class="btn-toggle active flex-1 text-xs" onclick="toggleBtn(this, 'safety')">Stable</button>
                        <button class="btn-toggle flex-1 text-xs" onclick="toggleBtn(this, 'safety')">Aggravated</button>
                    </div>
                </div>
                <div>
                    <label>Session Notes</label>
                    <textarea id="post-notes" rows="3" placeholder="Overall feel, technical breakthroughs..."></textarea>
                </div>
            </div>
        </div>

        <button onclick="generateLog()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-4 rounded-xl shadow-lg transition-colors">
            FINISH & GENERATE LOG
        </button>
    </div>

    <!-- HISTORY TAB -->
    <div id="content-history" class="hidden">
        <h2 class="text-xl font-bold mb-4">Saved Logs</h2>
        <div id="history-container" class="space-y-4 text-sm">
            <!-- Logs go here -->
        </div>
    </div>

    <!-- Modal for Log Output -->
    <div id="log-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-sm p-6 rounded-2xl shadow-2xl">
            <h3 class="text-lg font-bold mb-4">Workout Log Generated</h3>
            <textarea id="log-output" class="w-full h-64 text-xs font-mono mb-4 bg-black p-3" readonly></textarea>
            <div class="flex gap-3">
                <button onclick="copyLog()" class="flex-1 bg-sky-600 py-2 rounded-lg font-bold">Copy Text</button>
                <button onclick="closeModal()" class="flex-1 bg-slate-700 py-2 rounded-lg">Close</button>
            </div>
        </div>
    </div>

    <script>
        const sprintBaseline = {
            'Tue': { name: 'Strength & Alignment', exercises: [
                { name: 'Scapular Pull-ups', circuits: 3, cues: 'Dead hang, pull shoulders down, lock elbows' },
                { name: 'Hollow Body Holds', circuits: 3, cues: 'Lower back pinned to floor, toes pointed' },
                { name: 'Banded Leg Alignment', circuits: 3, cues: 'Band above knee, 90deg hold (Silent Sanctuary)' }
            ]},
            'Thu': { name: 'Strength & Alignment', exercises: [
                { name: 'Scapular Pull-ups', circuits: 3, cues: 'Dead hang, pull shoulders down, lock elbows' },
                { name: 'Hollow Body Holds', circuits: 3, cues: 'Lower back pinned to floor, toes pointed' },
                { name: 'Banded Leg Alignment', circuits: 3, cues: 'Band above knee, 90deg hold (Silent Sanctuary)' }
            ]},
            'Sun': { name: 'Strength & Alignment', exercises: [
                { name: 'Scapular Pull-ups', circuits: 3, cues: 'Dead hang, pull shoulders down, lock elbows' },
                { name: 'Hollow Body Holds', circuits: 3, cues: 'Lower back pinned to floor, toes pointed' },
                { name: 'Banded Leg Alignment', circuits: 3, cues: 'Band above knee, 90deg hold (Silent Sanctuary)' }
            ]},
            'Mon': { name: 'Mobility & Skills', exercises: [
                { name: 'Ankle Wall Drives', circuits: 3, cues: 'No band, 5.5" cap, dynamic range' },
                { name: 'Planche Leans', circuits: 3, cues: 'Protraction focus, lean forward, straight arms' },
                { name: '90/90 Hip Openers', circuits: 3, cues: 'Back upright, rotate internal/external' }
            ]},
            'Wed': { name: 'Mobility & Skills', exercises: [
                { name: 'Ankle Wall Drives', circuits: 3, cues: 'No band, 5.5" cap, dynamic range' },
                { name: 'Planche Leans', circuits: 3, cues: 'Protraction focus, lean forward, straight arms' },
                { name: '90/90 Hip Openers', circuits: 3, cues: 'Back upright, rotate internal/external' }
            ]},
            'Fri': { name: 'Active Recovery & Rest', exercises: [] },
            'Sat': { name: 'Active Recovery & Rest', exercises: [] }
        };

        let currentWorkout = null;
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const today = days[new Date().getDay()];

        window.onload = () => {
            loadWorkout(today);
            loadHistory();
        };

        function loadWorkout(day) {
            currentWorkout = sprintBaseline[day];
            document.getElementById('workout-title').innerText = `${day}: ${currentWorkout.name}`;
            
            const container = document.getElementById('exercise-list');
            container.innerHTML = '';

            if (currentWorkout.exercises.length === 0) {
                container.innerHTML = `<p class="text-slate-400 italic">No structured baseline for today. Focused on active recovery and systemic calm.</p>`;
                return;
            }

            currentWorkout.exercises.forEach((ex, exIdx) => {
                const exCard = document.createElement('div');
                exCard.className = 'border-l-4 border-sky-800 pl-4 py-2';
                
                let circuitsHTML = '';
                for(let i=1; i<=ex.circuits; i++) {
                    circuitsHTML += `
                        <div class="mt-2 grid grid-cols-1 gap-1">
                            <label class="text-[10px] text-sky-400">Round ${i} Notes (Reps/Range)</label>
                            <input type="text" id="ex-${exIdx}-r${i}" placeholder="e.g. 12 reps, 5s hold" class="text-xs py-1">
                        </div>
                    `;
                }

                exCard.innerHTML = `
                    <h4 class="font-bold text-white text-md">${ex.name}</h4>
                    <p class="text-[10px] text-slate-500 mb-2 italic">${ex.cues}</p>
                    ${circuitsHTML}
                `;
                container.appendChild(exCard);
            });
        }

        function switchTab(tab) {
            document.getElementById('content-session').classList.toggle('hidden', tab !== 'session');
            document.getElementById('content-history').classList.toggle('hidden', tab !== 'history');
            document.getElementById('tab-session').classList.toggle('tab-active', tab === 'session');
            document.getElementById('tab-history').classList.toggle('tab-active', tab === 'history');
            if(tab === 'session') document.getElementById('tab-history').classList.add('text-slate-400');
            else document.getElementById('tab-history').classList.remove('text-slate-400');
        }

        function toggleBtn(btn, group) {
            const btns = btn.parentElement.querySelectorAll('.btn-toggle');
            btns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function setSSP(category, value) {
            const parent = document.getElementById(`ssp-${category}`);
            parent.querySelectorAll('.btn-toggle').forEach(b => {
                b.classList.toggle('active', b.innerText === value);
            });
        }

        function getActive(id) {
            const container = typeof id === 'string' ? document.getElementById(id) : id;
            const active = container.querySelector('.active');
            return active ? active.innerText : 'N/A';
        }

        function generateLog() {
            const energy = document.getElementById('energy').value;
            const sleep = getActive(document.querySelectorAll('.btn-toggle')[0].parentElement);
            const preNotes = document.getElementById('pre-notes').value;
            
            const warmupDone = document.getElementById('warmup-check').checked ? "YES" : "NO";
            const warmupNotes = document.getElementById('warmup-notes').value;

            const sSound = getActive('ssp-sound');
            const sSensation = getActive('ssp-sensation');
            const sPain = document.getElementById('ssp-pain').value;

            const safety = getActive(document.querySelectorAll('.btn-toggle')[document.querySelectorAll('.btn-toggle').length-2].parentElement);
            const postNotes = document.getElementById('post-notes').value;

            let exerciseLogs = '';
            currentWorkout.exercises.forEach((ex, exIdx) => {
                exerciseLogs += `\n[${ex.name.toUpperCase().replace(/\s/g, '_')}]: `;
                let rounds = [];
                for(let i=1; i<=ex.circuits; i++) {
                    const val = document.getElementById(`ex-${exIdx}-r${i}`).value || "completed";
                    rounds.push(`R${i}: ${val}`);
                }
                exerciseLogs += rounds.join(' | ');
            });

            const timestamp = new Date().toLocaleString();
            const log = `[DATE]: ${timestamp}
[WORKOUT]: ${today} - ${currentWorkout.name.toUpperCase().replace(/\s/g, '_')}

[PRE-WORKOUT_REPORT]
Energy: ${energy}/10
Sleep: ${sleep}
Notes: ${preNotes || "None"}

[WORKOUT_REPORT]
Warmup_Completed: ${warmupDone}
Warmup_Notes: ${warmupNotes || "None"}
${exerciseLogs}

[POST-WORKOUT_REPORT]
Knee: [${sSound} / ${sSensation} / P:${sPain}]
Safety_Cues: ${safety}
Notes: ${postNotes || "None"}`;

            document.getElementById('log-output').value = log;
            document.getElementById('log-modal').classList.remove('hidden');
            document.getElementById('log-modal').classList.add('flex');

            saveToHistory(log);
        }

        function saveToHistory(log) {
            let history = JSON.parse(localStorage.getItem('workout_history') || '[]');
            history.unshift({ date: new Date().toLocaleDateString(), log: log });
            localStorage.setItem('workout_history', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
            const container = document.getElementById('history-container');
            container.innerHTML = history.length ? '' : '<p class="text-slate-500 italic">No logs found yet.</p>';
            
            history.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'card text-xs';
                div.innerHTML = `
                    <div class="flex justify-between mb-2">
                        <span class="font-bold text-sky-400">${item.date}</span>
                        <button onclick="deleteLog(${idx})" class="text-red-500">Delete</button>
                    </div>
                    <pre class="bg-black/40 p-2 rounded overflow-x-auto whitespace-pre-wrap">${item.log}</pre>
                `;
                container.appendChild(div);
            });
        }

        function deleteLog(idx) {
            let history = JSON.parse(localStorage.getItem('workout_history') || '[]');
            history.splice(idx, 1);
            localStorage.setItem('workout_history', JSON.stringify(history));
            loadHistory();
        }

        function copyLog() {
            const textarea = document.getElementById('log-output');
            textarea.select();
            document.execCommand('copy');
            const btn = event.target;
            btn.innerText = "COPIED!";
            setTimeout(() => btn.innerText = "Copy Text", 2000);
        }

        function closeModal() {
            document.getElementById('log-modal').classList.add('hidden');
            document.getElementById('log-modal').classList.remove('flex');
        }
    </script>
</body>
</html>
