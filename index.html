<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>2026 Block 1 Circuit</title>
    
    <!-- PWA Manifest Inline (for compatibility) -->
    <link rel="manifest" href="data:application/manifest+json,{'name':'2026 Workout','short_name':'Workout','start_url':'.','display':'standalone','background_color':'#000000','theme_color':'#3b82f6','icons':[{'src':'https://cdn-icons-png.flaticon.com/512/2964/2964514.png','sizes':'512x512','type':'image/png'}]}">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .card { background: #111; border: 1px solid #222; }
        .slider {
            -webkit-appearance: none; width: 100%; height: 8px;
            border-radius: 5px; background: #333; outline: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 24px; height: 24px;
            border-radius: 50%; background: #3b82f6; cursor: pointer;
        }
        .btn-toggle { transition: all 0.2s ease; }
        .selected-yes { background-color: #ef4444 !important; color: white; border-color: #ef4444; }
        .selected-no { background-color: #22c55e !important; color: white; border-color: #22c55e; }
        /* Hide scrollbar but keep functionality */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 pb-32 md:max-w-lg md:mx-auto">

    <header class="mb-6 flex justify-between items-end">
        <div>
            <h1 class="text-2xl font-black text-blue-500 tracking-tighter italic">CIRCUIT LOG</h1>
            <p id="current-date" class="text-zinc-500 font-mono text-[10px] uppercase"></p>
        </div>
        <div id="routine-indicator" class="px-3 py-1 bg-zinc-800 rounded-full text-[10px] font-bold text-zinc-400 border border-zinc-700"></div>
    </header>

    <!-- Readiness & Knee Check -->
    <section class="card rounded-2xl p-5 mb-6">
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-[10px] font-bold mb-2 uppercase text-zinc-500">MG Fatigue</label>
                <input type="range" min="1" max="5" value="1" class="slider" id="mg-fatigue">
            </div>
            <div>
                <label class="block text-[10px] font-bold mb-2 uppercase text-zinc-500">Readiness</label>
                <input type="range" min="1" max="5" value="5" class="slider" id="readiness">
            </div>
        </div>

        <div class="pt-4 border-t border-zinc-800">
            <label class="block text-[10px] font-bold mb-3 uppercase text-zinc-500">Right Knee Pain?</label>
            <div class="flex space-x-2">
                <button onclick="setKneePain(false)" id="knee-no" class="btn-toggle flex-1 py-3 rounded-xl border border-zinc-700 font-bold bg-zinc-900 selected-no text-xs">NO</button>
                <button onclick="setKneePain(true)" id="knee-yes" class="btn-toggle flex-1 py-3 rounded-xl border border-zinc-700 font-bold bg-zinc-900 text-xs">YES</button>
            </div>
            <div id="knee-notes-container" class="hidden mt-3">
                <textarea id="knee-notes" placeholder="Pain details..." class="w-full bg-zinc-950 border border-red-900/30 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-red-600" rows="2"></textarea>
            </div>
        </div>
    </section>

    <!-- Circuit Container -->
    <div id="circuit-list" class="space-y-10"></div>

    <!-- Sticky Export -->
    <div class="fixed bottom-0 left-0 right-0 p-4 bg-black/90 backdrop-blur-lg border-t border-zinc-800 md:max-w-lg md:mx-auto z-50">
        <button onclick="exportLog()" class="w-full py-4 bg-blue-600 text-white font-black rounded-2xl uppercase text-sm shadow-lg shadow-blue-900/20 active:scale-95 transition-transform">
            Export Master Log
        </button>
        <p id="status-msg" class="text-center text-[10px] text-green-500 font-mono mt-2 hidden">COPIED TO CLIPBOARD</p>
    </div>

    <script>
        const routines = {
            strength: {
                title: "Strength & Alignment",
                exercises: [
                    { name: "Scapular Pull-ups", target: "10 Reps" },
                    { name: "Hollow Body Holds", target: "30-45s" },
                    { name: "Banded Leg Alignment", target: "15 Reps" }
                ],
                rounds: 3
            },
            mobility: {
                title: "Mobility & Skill",
                exercises: [
                    { name: "Planche Leans", target: "Max Lean" },
                    { name: "Hip Mobility (90/90)", target: "1m/side" },
                    { name: "Ankle Mobility", target: "15r/side" }
                ],
                rounds: 3
            }
        };

        let currentType = 'strength';
        let hasKneePain = false;

        function init() {
            const day = new Date().getDay();
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            currentType = [0, 2, 4].includes(day) ? 'strength' : 'mobility';
            document.getElementById('routine-indicator').innerText = routines[currentType].title;
            renderCircuit();
            registerServiceWorker();
        }

        function setKneePain(val) {
            hasKneePain = val;
            document.getElementById('knee-yes').className = val ? 'btn-toggle flex-1 py-3 rounded-xl font-bold selected-yes text-xs' : 'btn-toggle flex-1 py-3 rounded-xl border border-zinc-700 font-bold bg-zinc-900 text-xs';
            document.getElementById('knee-no').className = !val ? 'btn-toggle flex-1 py-3 rounded-xl font-bold selected-no text-xs' : 'btn-toggle flex-1 py-3 rounded-xl border border-zinc-700 font-bold bg-zinc-900 text-xs';
            document.getElementById('knee-notes-container').style.display = val ? 'block' : 'none';
        }

        function renderCircuit() {
            const container = document.getElementById('circuit-list');
            const data = routines[currentType];
            let html = "";

            for (let r = 1; r <= data.rounds; r++) {
                html += `
                    <div class="space-y-4">
                        <div class="flex items-center space-x-2 px-1">
                            <span class="h-px flex-1 bg-zinc-800"></span>
                            <h2 class="text-[10px] font-black text-zinc-600 uppercase tracking-[0.2em]">Round ${r}</h2>
                            <span class="h-px flex-1 bg-zinc-800"></span>
                        </div>
                        ${data.exercises.map((ex, exIdx) => `
                            <div class="card rounded-2xl p-4">
                                <div class="flex items-center justify-between mb-3">
                                    <div>
                                        <h3 class="text-sm font-bold text-white">${ex.name}</h3>
                                        <p class="text-[10px] text-zinc-500 uppercase font-bold">${ex.target}</p>
                                    </div>
                                    <input type="checkbox" class="round-check" data-round="${r}" data-ex="${ex.name}">
                                </div>
                                <input type="text" placeholder="Notes for this set..." 
                                    class="round-note w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2 text-xs text-zinc-400 focus:outline-none focus:border-blue-900"
                                    data-round="${r}" data-ex="${ex.name}">
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        function exportLog() {
            const date = new Date().toISOString().split('T')[0];
            const mg = document.getElementById('mg-fatigue').value;
            const ready = document.getElementById('readiness').value;
            const knee = hasKneePain ? `YES (${document.getElementById('knee-notes').value})` : "NO";
            
            let workoutSummary = [];
            document.querySelectorAll('.round-check').forEach((check, i) => {
                if(check.checked) {
                    const note = document.querySelectorAll('.round-note')[i].value;
                    workoutSummary.push(`R${check.dataset.round} ${check.dataset.ex}${note ? ' ('+note+')' : ''}`);
                }
            });

            const output = `DATE: ${date} | MG: ${mg} | READY: ${ready} | KNEE: ${knee} | LOG: ${workoutSummary.join('; ')}`;
            
            const el = document.createElement('textarea');
            el.value = output;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            const msg = document.getElementById('status-msg');
            msg.classList.remove('hidden');
            setTimeout(() => msg.classList.add('hidden'), 3000);
        }

        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', e => self.skipWaiting());
                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
                `;
                const blob = new Blob([swCode], {type: 'text/javascript'});
                const url = URL.createObjectURL(blob);
                navigator.serviceWorker.register(url);
            }
        }

        init();
    </script>
</body>
</html>
